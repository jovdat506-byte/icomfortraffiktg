<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iComfort</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07101f;
      color: white;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
      background: linear-gradient(180deg, #13233f 0%, #07101f 100%);
    }

    .hero-content {
      max-width: 700px;
      width: 100%;
    }

    .logo {
      width: 220px;
      max-width: 70%;
      border-radius: 20px;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 52px;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .highlight {
      color: #d5b083;
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.5;
      color: #d7dce5;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 16px 26px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .btn-primary {
      background: #d5b083;
      color: #07101f;
    }

    .btn-secondary {
      border: 1px solid #4b5870;
      color: white;
    }

    .features {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .feature {
      background: rgba(255,255,255,0.06);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      color: #e6e9ef;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 17px;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">

      <img 
        src="454954923_1854040268420511_7022625234280253427_n.jpg"
        alt="iComfort"
        class="logo"
      >

      <h1>
        iPhone olish endi
        <span class="highlight">yanada qulay</span>
      </h1>

      <p class="subtitle">
        Keng assortimentdagi iPhone’lar va sizga mos qulay bo‘lib to‘lash shartlari.
      </p>

<div class="buttons">

  <a
    href="https://t.me/iComfort_price"
    target="_blank"
    class="btn btn-primary"
  >
    Telegram kanalga o‘tish
  </a>

  <a
    href="tel:+998977325005"
    class="btn btn-secondary"
  >
    +998 97 732 50 05
  </a>

</div>

      <div class="features">
        <div class="feature">Qulay to‘lov</div>
        <div class="feature">Keng assortiment</div>
        <div class="feature">iPhone texnikalari</div>
      </div>

    </div>
  </section>

</body>
</html>
