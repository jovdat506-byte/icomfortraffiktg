<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iComfort</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07101f;
      color: #fff;
    }

    .hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(29, 54, 92, 0.9), transparent 45%),
        linear-gradient(180deg, #101d33 0%, #07101f 100%);
    }

    .hero-content {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .logo {
      width: 190px;
      max-width: 62vw;
      border-radius: 20px;
      margin-bottom: 28px;
      box-shadow: 0 14px 40px rgba(0,0,0,.25);
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.02;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
    }

    .highlight {
      color: #d5b083;
    }

    .subtitle {
      max-width: 560px;
      margin: 0 auto 28px;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.5;
      color: #d7dce5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .btn {
      min-width: 220px;
      padding: 16px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: .2s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: #d5b083;
      color: #07101f;
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      background: rgba(255,255,255,.04);
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .feature {
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.06);
      font-size: 14px;
      color: #e5e8ee;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 20px 16px;
      }

      .logo {
        width: 150px;
        margin-bottom: 22px;
      }

      h1 {
        font-size: 40px;
        line-height: 1.05;
      }

      .subtitle {
        font-size: 16px;
        margin-bottom: 24px;
      }

      .buttons {
        flex-direction: column;
        width: 100%;
      }

      .btn {
        width: 100%;
        min-width: 0;
      }

      .features {
        gap: 8px;
      }

      .feature {
        font-size: 13px;
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">

      <img
        src="454954923_1854040268420511_7022625234280253427_n.jpg"
        alt="iComfort"
        class="logo"
      >

      <h1>
        iPhone olish endi
        <span class="highlight">yanada qulay</span>
      </h1>

      <p class="subtitle">
        Keng assortimentdagi iPhone’lar va sizga mos qulay bo‘lib to‘lash shartlari.
      </p>

      <div class="buttons">

        <a
          href="https://t.me/iComfort_price"
          target="_blank"
          class="btn btn-primary"
        >
          Narxlarni Telegram’da ko‘rish
        </a>

        <a
          href="tel:+998977325005"
          class="btn btn-secondary"
        >
          Qo‘ng‘iroq qilish
        </a>

      </div>

      <div class="features">
        <div class="feature">Qulay to‘lov</div>
        <div class="feature">Keng assortiment</div>
        <div class="feature">iPhone texnikalari</div>
      </div>

    </div>
  </section>

</body>
</html>
